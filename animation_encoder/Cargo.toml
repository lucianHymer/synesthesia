[package]
name = "animation_encoder"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Binary encoder for LED animations targeting ESP32 devices"
repository = "https://github.com/yourname/synesthesia"
keywords = ["led", "animation", "esp32", "encoding", "embedded"]
categories = ["embedded", "multimedia", "encoding"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
thiserror = "1.0"
byteorder = "1.4"
napi = { version = "2", features = ["serde-json"], optional = true }
napi-derive = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3.0"

[build-dependencies]
napi-build = "2"

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]